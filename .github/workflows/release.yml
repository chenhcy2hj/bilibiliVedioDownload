name: Build & Release

# 推送 v* 标签 → 双平台远端构建 → 自动发布到 GitHub Release（全自动，无需本地操作）
# workflow_dispatch → 仅构建并产出 artifact（不发布，供手动验证）
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write # 发布 Release 需要（创建/更新 + 生成 release notes）

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15 # arm64
            platform: macos-arm64
            ffmpeg_pkg: "@ffmpeg-installer/darwin-arm64"
            ffmpeg_bin: "ffmpeg"
            out_name: "BiliDownloader-macOS-arm64.zip"
          - os: windows-latest
            platform: windows-x64
            ffmpeg_pkg: "@ffmpeg-installer/win32-x64"
            ffmpeg_bin: "ffmpeg.exe"
            out_name: "BiliDownloader-Windows-x64.zip"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 构建前端产物
        run: |
          cd frontend
          npm install
          npm run build

      - name: 安装 Python 依赖
        run: pip install -r requirements.txt pyinstaller

      - name: 安装 Playwright Chromium（P5：捆绑进发布包，打包版恢复无感获取）
        # 有头 Chromium 缓存：macOS ~/Library/Caches/ms-playwright；Windows %LOCALAPPDATA%\ms-playwright
        # 体积 ~160MB，构建时长 +1~2 分钟（接受）
        run: python -m playwright install chromium

      - name: 获取静态 FFmpeg（npm 包内置二进制，绕开 GitHub 直连下载不稳定）
        shell: bash
        run: |
          mkdir -p packaging/ffmpeg-${{ matrix.platform }}
          cd packaging
          npm init -y >/dev/null 2>&1
          npm install ${{ matrix.ffmpeg_pkg }}
          cp node_modules/${{ matrix.ffmpeg_pkg }}/${{ matrix.ffmpeg_bin }} ffmpeg-${{ matrix.platform }}/${{ matrix.ffmpeg_bin }}
          chmod +x ffmpeg-${{ matrix.platform }}/${{ matrix.ffmpeg_bin }}
          rm -rf node_modules package.json package-lock.json

      - name: PyInstaller 打包
        run: pyinstaller packaging/bilidownloader.spec --noconfirm

      - name: 附加有头 Chromium 到产物（P5）
        # 不进 PyInstaller（macOS 会尝试重签 Chrome.app 嵌套 Framework 导致失败），
        # 打包完成后直拷 ms-playwright 缓存（保留原始签名），即 sys._MEIPASS/_browsers
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            SRC="$HOME/Library/Caches/ms-playwright"
            DEST="dist/BiliDownloader.app/Contents/Frameworks/_browsers"
          else
            SRC="$LOCALAPPDATA/ms-playwright"
            DEST="dist/BiliDownloader/_internal/_browsers"
          fi
          mkdir -p "$DEST"
          cp -R "$SRC"/chromium-[0-9]* "$DEST/"
          du -sh "$DEST"/*

      - name: 生成 zip 产物
        shell: bash
        run: |
          cd dist
          if [ "${{ matrix.os }}" = "macos-15" ]; then
            zip -ryq ${{ matrix.out_name }} BiliDownloader.app
          else
            powershell -Command "Compress-Archive -Path BiliDownloader -DestinationPath ${{ matrix.out_name }} -Force"
          fi

      - name: 上传构建产物（artifact）
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.out_name }}
          path: dist/${{ matrix.out_name }}
          retention-days: 3

  publish:
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/v') # 仅 tag 触发时自动发布
    runs-on: ubuntu-latest
    steps:
      - name: 收集双平台产物
        uses: actions/download-artifact@v4
        with:
          path: ./dist
          merge-multiple: true

      - name: 列出待发布资产
        run: ls -lh dist/

      - name: 发布到 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/BiliDownloader-*.zip
          overwrite_files: true # 覆盖同名资产（重发版本时）
          generate_release_notes: true
          name: BiliDownloader ${{ github.ref_name }}
          body: |
            ## BiliDownloader ${{ github.ref_name }}

            双平台远端构建产物（GitHub Actions 自动发布）：
            - `BiliDownloader-macOS-arm64.zip`（macOS 解压即用，未签名首次需右键 → 打开）
            - `BiliDownloader-Windows-x64.zip`（Windows 解压后运行 BiliDownloader.exe）

            > ⚠️ 仅供个人学习使用：风控与合规责任由使用者自行承担；请遵循平台规则，勿下载传播受版权保护的内容。