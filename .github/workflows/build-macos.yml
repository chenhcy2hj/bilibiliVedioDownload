name: Build macOS arm64

# 手动触发或推送 v* 标签时，在远端（macos-15 arm64 runner）构建 macOS 独立产物
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build-macos:
    runs-on: macos-15 # arm64（Apple Silicon）
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 构建前端产物
        run: |
          cd frontend
          npm install
          npm run build

      - name: 安装 Python 依赖
        run: pip install -r requirements.txt pyinstaller

      - name: 获取静态 FFmpeg (darwin-arm64，npm 包内置二进制)
        run: |
          mkdir -p packaging/ffmpeg-macos-arm64
          cd packaging
          npm init -y >/dev/null 2>&1
          npm install @ffmpeg-installer/darwin-arm64
          cp node_modules/@ffmpeg-installer/darwin-arm64/ffmpeg ffmpeg-macos-arm64/ffmpeg
          chmod +x ffmpeg-macos-arm64/ffmpeg
          rm -rf node_modules package.json package-lock.json

      - name: PyInstaller 打包
        run: pyinstaller packaging/bilidownloader.spec --noconfirm

      - name: 生成 zip 产物
        run: |
          cd dist
          zip -ryq BiliDownloader-macOS-arm64.zip BiliDownloader.app

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: BiliDownloader-macOS-arm64
          path: dist/BiliDownloader-macOS-arm64.zip
          retention-days: 14